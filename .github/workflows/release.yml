name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release macOS
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-darwin

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          cargo install trunk --locked
          cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build CLI
        run: cargo build --release -p cli --target aarch64-apple-darwin

      - name: Build Tauri App
        working-directory: ui
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Calculate Hashes
        id: hashes
        run: |
          mv target/aarch64-apple-darwin/release/cli target/aarch64-apple-darwin/release/boltfetch
          CLI_SHA=$(shasum -a 256 target/aarch64-apple-darwin/release/boltfetch | awk '{ print $1 }')
          UI_SHA=$(shasum -a 256 ui/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | awk '{ print $1 }')
          echo "CLI_SHA=${CLI_SHA}" >> $GITHUB_ENV
          echo "UI_SHA=${UI_SHA}" >> $GITHUB_ENV
          # Extract version from tag (e.g. refs/tags/v0.5.0 -> 0.5.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/aarch64-apple-darwin/release/boltfetch
            ui/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          name: ${{ github.ref_name }}
          generate_release_notes: true

      - name: Update Homebrew Tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        if: env.TAP_GITHUB_TOKEN != ''
        run: |
          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/SriVinayA/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          
          # Update CLI Formula
          sed -i '' -e 's|url "https://github.com/SriVinayA/BoltFetch/releases/download/v.*|url "https://github.com/SriVinayA/BoltFetch/releases/download/v'${VERSION}'/boltfetch"|g' boltfetch.rb
          sed -i '' -e 's|version ".*"|version "'${VERSION}'"|g' boltfetch.rb
          sed -i '' -e 's|sha256 ".*"|sha256 "'${CLI_SHA}'"|g' boltfetch.rb
          
          # Update UI Cask
          sed -i '' -e 's|url "https://github.com/SriVinayA/BoltFetch/releases/download/v.*/.*dmg"|url "https://github.com/SriVinayA/BoltFetch/releases/download/v'${VERSION}'/BoltFetch_'${VERSION}'_aarch64.dmg"|g' Casks/boltfetch-ui.rb
          sed -i '' -e 's|version ".*"|version "'${VERSION}'"|g' Casks/boltfetch-ui.rb
          sed -i '' -e 's|sha256 ".*"|sha256 "'${UI_SHA}'"|g' Casks/boltfetch-ui.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Bump BoltFetch to v${VERSION} via CI"
          git push origin main
